  - id: WK-PROG-008
    name: "/api/areas requires auth (401 unauthenticated), contrary to the stale 2026-09-01 frontend comments claiming 404"
    category: security
    priority: high
    platforms: [web]
    steps:
      - name: "GET /api/areas with no credential"
        action: "http: GET /api/areas"
        expect_status: 401
        expect_body_contains: "{\"error\":\"unauthorized\",\"message\":\"authentication required\"}"
        expected: "401, exact body confirmed live -- the SAME wording as every other gated /api/* route, via apiPathsOnly(authhttp.Middleware(authDB), content). NEVER 404: several frontend comments dated 2026-09-01 (study-plan.component.ts, area-detail.component.ts, curriculum.component.ts, core/knowledge.ts, practice.component.ts) still read \"ON THIS BUILD /api/areas ANSWERS 404\", describing a pre-auth-cutover build. This case is the regression pin against that ever becoming true again silently -- a reversion to 404 would break /plan's ranking (core/study-plan.ts's rankAreasForStudy, which consumes GET /api/areas) differently than the current 401 does, and a bank that only ever asserted the CURRENT status could not tell the two failure modes apart without this explicit case."
      - name: "GET /api/areas, authenticated, reaches real content"
        action: "http: GET /api/areas"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"areas\""
        expected: "200 OK with a real \"areas\" array -- confirmed live. /plan's ranking needs exactly this route reachable; this bank confirms reachability and authentication, not the areas publication-state machine itself (out of scope, owned by the areas/practice sub-project)."
    tags: [progress, plan, auth, security, regression]
    estimated_duration: "5s"
