  - id: WK-PROG-009
    name: "Cross-account isolation: milosvasic's /api/progress never reflects rami's stored position, and vice versa"
    category: security
    priority: critical
    platforms: [web]
    steps:
      - name: "GET as the admin-mode identity shows only its own, known entries"
        action: "http: GET /api/progress"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"chapter_slug\": \"wk-prog-qa-roundtrip\""
        expected: "200 OK; the admin-mode identity's (milosvasic's, for this bank's primary invocation) own positions are present. This is the ONLY assertion this harness can make within a single invocation: this build's testbank schema has no expect_body_not_contains field (confirmed: grep -n expect_body_not_contains pkg/testbank/schema.go matches nothing), so a positive check on one identity's own data is the strongest mechanically-expressible step here -- it cannot, by itself, prove the absence of a SECOND identity's data, only its own presence."
      - name: "The second identity's (rami's) own, independent GET"
        action: "http: GET /api/progress"
        _skip: true
        _skip_reason: "SKIP-OK: same single-identity-per-invocation limitation auth-session.yaml's WK-AUTH-005 investigation already established for this exact HelixQA build -- `auth: admin` is bound to whichever --admin-user/--admin-pass the WHOLE invocation was started with (one cached slot per process, keyed by the literal string \"admin\"); there is no `as:<user>` CLI flag wired (cmd/helixqa/http.go's flag set has no flag populating HTTPExecutor.UserCredentials), and no cross-step response-capture mechanism exists to carry a second, dynamically-obtained token into this step even if one were minted via an explicit http: POST /api/auth/login step (which would additionally require embedding rami's real password, forbidden by CONST-042/11.4.10). CONFIRMED LIVE via direct curl with TWO real, independently-authenticated seeded accounts in this task's own verification session (not merely a same-account concurrency case like WK-AUTH-005 -- this is a genuinely different named identity): after milosvasic POSTed wk-prog-qa-roundtrip/wk-prog-qa-zero/wk-prog-qa-redaction-canary, a fresh, independent rami login's GET /api/progress returned ONLY rami's own prior entry (wk-prog-qa-rami-canary) and none of milosvasic's three -- real, live, two-account isolation confirmed with no shared-slot limitation at all, because direct curl needs no single-slot cache. Full transcript: task-1-report.md."
        expected: "200 OK, rami's own view, containing ONLY rami's own entries and none of milosvasic's -- confirmed live via curl, not via this harness."
      - name: "GOLDEN-BAD CONTROL, LIVE, BOTH DIRECTIONS -- session-key collapse genuinely leaks; the real code genuinely does not"
        action: "http: GET /api/progress"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"chapter_slug\": \"wk-prog-qa-roundtrip\""
        _skip: true
        _skip_reason: "SKIP-OK: this step exists only to carry the golden-bad control's own record inline; the actual mutation, FAIL, revert and PASS were all performed and verified via direct curl outside this harness (this build's single-identity-per-invocation limit applies here too -- see the two skip reasons above). MUTATION: authhttp.UserProgressKey changed from `ProgressKeyPrefix + strconv.FormatInt(userID, 10)` to `ProgressKeyPrefix + \"SHARED\"` (collapsing every authenticated user's progress key onto one literal string), plus dropping the then-unused strconv import (a compile-required second line of the same change). `git diff` confirmed exactly these two lines; `bash scripts/build.sh` built clean. UNLIKE THE WK-PROG-005 CONTROL, `bash scripts/restart.sh` was NOT blocked this time and deployed the mutated binary live (source_commit == git rev-parse HEAD at the mutated commit, confirmed via /api/health). FAIL, confirmed live: a real POST as milosvasic (chapter_slug wk-prog-qa-golden-bad-isolation) landed under the collapsed key auth-user:SHARED, and a real, independently-authenticated GET as rami returned 200 WITH THAT EXACT ENTRY -- milosvasic's data served back to rami, a genuine, reproduced cross-account leak. The mutation was then reverted (git diff empty, confirmed), rebuilt, and redeployed (source_commit == git rev-parse HEAD again, confirmed). PASS, confirmed live: the SAME two-account check re-run showed rami's GET back to only rami's own pre-existing entry (wk-prog-qa-rami-canary), with no trace of the collapsed-key canary, and milosvasic's GET back to showing only milosvasic's own three entries. Full request/response transcript for both the FAIL and PASS sides: task-1-report.md."
        expected: "The mutated build genuinely leaks across accounts (FAIL, confirmed live); the reverted, real code genuinely does not (PASS, confirmed live) -- see the skip reason for the full live transcript reference."
    tags: [progress, security, isolation, regression, golden-bad]
    estimated_duration: "10s"
    expected_result: "Two full-access seeded accounts (FR-010: milosvasic and rami both get full, equal access; no authorization difference between them) have completely disjoint, independently-keyed progress stores -- confirmed live over HTTP with two real, independently-authenticated accounts, and confirmed by a live, reproduced golden-bad mutation showing exactly what a broken version of this property looks like."

  - id: WK-PROG-010
    name: "The redaction gap (real, live, unguarded): a stored position referencing a since-redacted pid is served back verbatim, unlike GET /api/passages/{pid} for the SAME pid"
    category: security
    priority: critical
    platforms: [web]
    steps:
      - name: "POST a position referencing a REAL, currently-redacted pid (curriculum/redactions.jsonl, seq 1, reason_code direct_personal_identifier)"
        action: "http: POST /api/progress"
        auth: "admin"
        body:
          chapter_slug: "wk-prog-qa-redaction-canary"
          pid: "01M1ET0MFK3B0DMZABYV586NTW"
          t_seconds: 7.25
        expect_status: 200
        expect_body_contains: "\"pid\": \"01M1ET0MFK3B0DMZABYV586NTW\""
        expected: "200 OK -- confirmed live that ProgressHandler's POST path performs NO redaction/publication check at all before storing. `grep -rn redact internal/api/progress*.go pkg/authhttp/progress*.go` matches nothing; passage.ParsePID only validates ULID SHAPE, never whether the pid is currently published. This pid is real: curriculum/redactions.jsonl's first row, `{\"seq\":1,\"pid\":\"01M1ET0MFK3B0DMZABYV586NTW\",\"action\":\"redact\",\"reason_code\":\"direct_personal_identifier\",\"by\":\"operator-decision-26\",\"at\":\"2026-09-02T19:49:02Z\"}`."
      - name: "GET serves the redacted pid back verbatim -- THE GAP, confirmed live and OBSERVED ONLY, never fixed here"
        action: "http: GET /api/progress"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"pid\": \"01M1ET0MFK3B0DMZABYV586NTW\""
        expected: "200 OK; the stored position's pid, chapter_slug and t_seconds are all echoed back UNFILTERED, exactly as the design doc's flagged gap predicts. writeJSON's own suppression filter (writeFiltered/filterSuppressed, suppression.go) masks matched PASSAGE TEXT spans in a rendered body -- it has NOTHING to mask here, because a Position's JSON carries no transcript prose, only the opaque pid string, a chapter_slug, a float and a timestamp. THIS IS THE FINDING TASK 3 OF THIS SUB-PROJECT'S IMPLEMENTATION PLAN MUST INVESTIGATE WITH FULL SYSTEMATIC-DEBUGGING RIGOR (per this task's own brief); it is reported here as an OBSERVATION, exactly as instructed, and is NOT fixed by this task."
      - name: "Contrast: GET /api/passages/{pid} for the SAME pid DOES enforce the redaction gate"
        action: "http: GET /api/passages/01M1ET0MFK3B0DMZABYV586NTW"
        auth: "admin"
        expect_status: 410
        expect_body_contains: "\"status\": \"redacted\""
        expected: "410 Gone, `{\"message\": \"This passage exists and its content has been withheld. The citation is not broken.\", \"pid\": \"01M1ET0MFK3B0DMZABYV586NTW\", \"status\": \"redacted\"}` -- confirmed live. THIS IS THE ASYMMETRY: the SAME pid is REFUSED by /api/passages (which enforces the publication/redaction gate) and SERVED VERBATIM by /api/progress (which does not, per the two steps above). A reader's own stored progress position can therefore disclose the raw pid of a since-redacted passage (and confirm, via that pid, that /api/passages/{pid} answers \"exists but withheld\" rather than \"never existed\") through a route the redaction gate was never wired to. WHETHER THIS IS GENUINELY EXPLOITABLE beyond that -- e.g. whether chapter_slug/t_seconds together disclose enough to locate WHERE in a recording the redacted content sat -- is Task 3's mandatory investigation, not this task's; this case's job is only to establish and pin the current, live, observable behavior."
    tags: [progress, security, redaction, regression, task-3-feeder]
    estimated_duration: "5s"
    expected_result: "A stored position for a since-redacted pid is served back completely unfiltered by /api/progress, in direct contrast to the SAME pid's correctly-enforced 410 at /api/passages/{pid} -- a real, live, code-confirmed gap this bank observes and pins for Task 3's mandatory investigation, never fixed here."

  - id: WK-PROG-011
    name: "POST /api/auth/migrate-progress cannot corrupt or leak this bank's other cases' stored state"
    category: security
    priority: medium
    platforms: [web]
    steps:
      - name: "GET progress before the migrate-progress probe, to compare against"
        action: "http: GET /api/progress"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"chapter_slug\": \"wk-prog-qa-zero\""
        expected: "200 OK; the known wk-prog-qa-zero entry from WK-PROG-006 is present -- this is the baseline the next step must not disturb."
      - name: "POST migrate-progress with a record_id this deployment cannot possibly have"
        action: "http: POST /api/auth/migrate-progress"
        auth: "admin"
        body:
          record_id: "wk-prog-qa-nonexistent-record-id"
          choice: "discard"
        expect_status: 503
        expect_body_contains: "\"error\":\"migration_not_configured\""
        expected: "503, confirmed live -- NOT 404 record_not_found as the general contract would suggest for an unknown record_id, because THIS deployment has no T574 cutover census configured at all (`mig == nil` in wrapWithAuth's own wiring; `buildMigrationDeps` failed its precondition and degraded rather than crashing, per that function's own doc comment). `authMigrateProgressHandler` checks `mig == nil` before ever looking up the record. Both outcomes (503 here, or 404 on a deployment WITH a census but lacking this specific record) are safe non-mutating refusals; this case documents which one this environment actually gives, live, rather than assuming the general-case 404."
      - name: "GET progress after the migrate-progress probe -- must be byte-identical to the baseline"
        action: "http: GET /api/progress"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"chapter_slug\": \"wk-prog-qa-zero\""
        expected: "200 OK; the SAME known entries are present, confirmed live via a full before/after diff during this task's investigation (byte-identical). A bogus migrate-progress call neither corrupts nor silently mutates this session's stored positions -- the narrow confirmation this design's scope calls for, not a full re-test of the T574-576 migration flow (already covered by the auth & session sub-project's own research)."
    tags: [progress, migration, security, regression]
    estimated_duration: "5s"
    expected_result: "An invalid/unusable migrate-progress call is a safe, non-mutating refusal on this deployment (503, migration not configured) and never disturbs this session's own stored progress state"
