        expect_body_contains: "\"code\": \"unknown_parameter\""
        expected: "400, exact body confirmed live (writeError's own 2-space-indented shape -- {\"error\":{\"code\":\"unknown_parameter\",\"message\":\"include accepts only the value \\\"held_back\\\"\",\"field\":\"include\"}}) -- a silently-dropped filter would be a client believing it asked a question it did not ask"
    tags: [areas, taxonomy, security, regression]
    estimated_duration: "5s"
    expected_result: "An unrecognised filter value is a refusal, not a quietly-ignored no-op"

  - id: WK-AREAS-008
