  - id: WK-PRACTICE-001
    name: "GET /api/areas/{area}/questions requires auth LIVE, contradicting its own 'SESSIONLESS by design' code comment"
    category: security
    priority: high
    platforms: [web]
    steps:
      - name: "Unauthenticated access is refused, live-reconfirmed 2026-09-19 -- the same finding Task 1 reported, unchanged"
        action: "http: GET /api/areas/01M1GWW49GNKYBEXFFCNRWM1SY/questions"
        expect_status: 401
        expect_body_contains: "{\"error\":\"unauthorized\",\"message\":\"authentication required\"}"
        expected: "401, exact body confirmed live -- questions.go's own package doc comment claims this route is 'SESSIONLESS by design -- a practice deck needs no login' (D10 block), but it sits on the same mux wrapWithAuth/apiPathsOnly blankets every other /api/* route with, and no per-route exemption carves it out. This is a documentation/wiring DISCREPANCY, flagged for the operator's attention (see this file's header) -- fail-closed is the safer direction, so this is not treated as a security defect and is out of this task's scope to fix."
      - name: "With a real session, the route serves its documented 200 shape -- this bank's every other case therefore correctly uses auth: admin like the rest of this file"
        action: "http: GET /api/areas/01M1GWW49GNKYBEXFFCNRWM1SY/questions"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"status\": \"ok\""
        expected: "200 OK once authenticated -- confirmed live 2026-09-19: this area serves 9 real questions (1 short, 8 long) via this exact route"
    tags: [practice-deck, questions, security, regression]
    estimated_duration: "5s"
    expected_result: "The route's real, live-observed behaviour is auth-gated, not sessionless -- this bank asserts the observed reality (matching every other case in this file's auth: admin convention) rather than the code comment's unverified claim, and documents the discrepancy explicitly for the operator."

