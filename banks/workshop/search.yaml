  - id: WK-SEARCH-010
    name: "Redaction at the HTTP search level: a query matching ONLY a redacted passage returns zero hits, not the passage"
    category: security
    priority: critical
    platforms: [web]
    steps:
      - name: "Confirm the redacted passage genuinely exists and is genuinely redacted (410), so the search assertion below is meaningful"
        action: "http: GET /api/passages/01M1ET0MFK3B0DMZABYV586P81"
        auth: "admin"
        expect_status: 410
        expect_body_contains: "\"status\": \"redacted\""
        expected: "410, confirming this pid is a REAL passage that genuinely exists and is genuinely redacted (reason_code unreleased_commercial_plan_not_for_export, cross-referenced from curriculum/redactions.jsonl against curriculum/passages.jsonl -- a distinguishing term was found by building a whole-corpus word index over all 33440 rows and selecting a word that appears in EXACTLY ONE row, this redacted one)"
      - name: "A search for that passage's own unique, distinguishing, non-personal term returns no_match, not the passage"
        action: "http: GET /api/search?q=documentations"
        auth: "admin"
        expect_status: 200
        expect_body_contains: "\"status\": \"no_match\""
        expected: "200 OK, no_match -- confirmed live: the term \"documentations\" appears in exactly ONE passage in the entire 33440-row corpus (verified by direct word-index construction over curriculum/passages.jsonl), that passage is redacted (previous step), and the search genuinely returns ZERO hits for it despite the passage existing. GOLDEN-BAD CONTROL RUN (see bank header, the highest-value control in this bank): the runtime `AND p.redacted = 0` SQL clause (lexical.go) was disabled (mutated to a tautology), rebuilt and restarted live -- the SAME query STILL returned no_match, no change. Root-caused via a direct, live, read-only sqlite3 query against the mounted index volume: the redacted row has NULL text and is genuinely absent from the passages_fts table it would need to be in to match at all (submodules/passage's Registry.BuildDB never inserts a redacted row into the FTS index in the first place -- structural exclusion, not a query-time filter). The mutation was reverted, rebuilt, restarted; behaviour is unchanged (still no_match) because it was never the operative control. See bank header REAL FINDING / GOLDEN-BAD CONTROLS sections and task-1-report.md for the full transcript."
    tags: [search, security, redaction, regression]
    estimated_duration: "10s"
    expected_result: "A redacted passage's own distinguishing words never surface a hit for it, and this bank proves both the observable behaviour AND the structural mechanism behind it"

