  - id: FIX-OC4-012
    name: "pkg/agent/graph — agent-loop termination + Done-not-executed safety"
    category: regression
    priority: critical
    platforms: [linux, all]
    steps:
      - name: "All four termination conditions stay wired: Done, MaxSteps, Stuck, ctx-cancel"
        action: "go test -mod=vendor -count=1 -run 'TestRun_TerminatesOnDoneAction|TestRun_TerminatesOnMaxSteps|TestRun_StuckDetectionFires|TestRun_ContextCanceledBeforeFirstStep' ./pkg/agent/graph/..."
