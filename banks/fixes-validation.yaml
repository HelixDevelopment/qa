  - id: FIX-OC4-016
    name: "pkg/regression/deltae — CIEDE2000 conformance against Sharma 2005"
    category: regression
    priority: critical
    platforms: [linux, all]
    steps:
      - name: "10 Sharma reference pairs produce the canonical ΔE within ±0.01"
        action: "go test -mod=vendor -count=1 -run TestDeltaE2000_SharmaReferenceValues ./pkg/regression/..."
        expected: "PASS — if any drift, the CIEDE2000 implementation is broken"
      - name: "sRGB primary colors (R/G/B) produce published sRGB→LAB reference values within ±0.2"
        action: "go test -mod=vendor -count=1 -run 'TestRGBToLAB_PrimaryRed|TestRGBToLAB_PrimaryGreen|TestRGBToLAB_PrimaryBlue|TestRGBToLAB_Black|TestRGBToLAB_White' ./pkg/regression/..."
        expected: "All PASS — sRGB→XYZ→LAB (D65) pipeline stays correct"
      - name: "ΔE is symmetric, non-negative, zero-for-identical"
        action: "go test -mod=vendor -count=1 -run 'TestDeltaE2000_IdenticalInputsZero|TestDeltaE2000_Symmetric|TestDeltaE2000_NonNegative' ./pkg/regression/..."
        expected: "All PASS"
      - name: "Brand compliance passes/fails deterministically on synthetic images"
        action: "go test -mod=vendor -count=1 -run TestCheckBrandCompliance ./pkg/regression/..."
        expected: "All PASS — full-pass / full-fail / partial / empty / error paths all green"
    tags: [regression, phase2, openclawing4, regression, deltae, ciede2000, sharma]
    estimated_duration: "1s"
    expected_result: "CIEDE2000 stays reference-conformant against the Sharma 2005 benchmark"
    fix_reference:
      bug_id: "FIX-OC4-016"
      description: "Guards two orthogonal color-science invariants. (1) CIEDE2000: the formula is notoriously prone to subtle sign/branching errors (Sharma 2005 itself was published to clarify ambiguities in the CIE 2002 spec). The 10-pair reference table is the gold-standard conformance test; any drift is a hard correctness bug with brand-compliance impact. (2) sRGB → LAB: the D65 illuminant + IEC 61966-2-1 gamma + CIE 2° observer combination is the standard web/video pipeline. Getting the matrix coefficients or gamma branch wrong would silently bias every color measurement in the system. Both invariants have tight tolerances (±0.01 on ΔE, ±0.2 on primary color LAB)."
      fix_file: "helix_qa/pkg/regression/deltae.go"
      fix_commit: "pending"

  - id: FIX-OC4-017
    name: "pkg/regression/report — template.URL bypass for inline data-URL images"
    category: regression
    priority: high
    platforms: [linux, all]
    steps:
      - name: "Rendered HTML contains 'data:image/png;base64,' unescaped (template.URL applied)"
        action: "go test -mod=vendor -count=1 -run TestReport_Render_HappyPath ./pkg/regression/..."
        expected: "PASS — if html/template sanitizes data URLs, this test fails"
      - name: "Empty sessions / missing Before / missing After all error with sentinels"
        action: "go test -mod=vendor -count=1 -run 'TestReport_Render_EmptySessionsError|TestReport_Render_MissingBeforeError|TestReport_Render_MissingAfterError' ./pkg/regression/..."
        expected: "All PASS"
    tags: [regression, phase2, openclawing4, regression, report, html, template-url]
    estimated_duration: "1s"
    expected_result: "HTML reporter emits self-contained reports with unescaped data URLs"
    fix_reference:
      bug_id: "FIX-OC4-017"
      description: "Initial Reporter impl used plain string fields for the base64 data URLs. html/template's contextual autoescape sanitizes data: URLs by default (replacing them with #ZgotmplZ) because arbitrary data URLs CAN carry XSS payloads. Since our data URLs are produced by encodePNGDataURL under our control (always data:image/png;base64,<safe-base64>), switching the DataURL fields to template.URL bypasses the sanitization safely. The regression test asserts the unescaped prefix appears in output — any future refactor that drops the template.URL cast will fail this test immediately, before broken reports ship to QA sessions."
