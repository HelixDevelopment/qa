      - name: "Done action must NEVER reach the Executor"
        action: "go test -mod=vendor -count=1 -run TestRun_TerminatesOnDoneAction ./pkg/agent/graph/..."
        expected: "PASS — executor saw 2 actions (click + type), Done was recorded in History but not executed"
      - name: "sameCore ignores Reason so stuck detection fires on VLM-generated prose drift"
        action: "go test -mod=vendor -count=1 -run 'TestSameCore_IgnoresReason|TestSameCore_DistinguishesCoords' ./pkg/agent/graph/..."
        expected: "Both PASS"
      - name: "StepTimeout cancels slow iterations"
        action: "go test -mod=vendor -count=1 -run TestRun_StepTimeoutCancelsSlowSteps ./pkg/agent/graph/..."
        expected: "PASS — slow Screenshot aborted in < 100ms with StepTimeout=10ms"
    tags: [regression, phase3, openclawing4, agent, graph, runner, termination]
    estimated_duration: "1s"
    expected_result: "Runner stays bounded, auditable, and never dispatches a Done action to the device"
    fix_reference:
      bug_id: "FIX-OC4-012"
      description: "Guards four orthogonal Runner invariants. (1) The Done action is the VLM's 'goal reached' signal — dispatching it to the device executor (uinput / scrcpy control) would result in a no-op at best and undefined behaviour at worst; Runner records Done in History but stops before Execute. (2) MaxSteps / Stuck termination must return a successful (err=nil) Result so callers can branch on Done/Stuck/MaxSteps flags — hard-erroring would force every caller into error wrapping for normal outcomes. (3) sameCore(a, b) ignores Reason because VLMs emit different rationalizations for the same literal action on each call; stuck detection must see through prose drift to catch the actual repetition. (4) StepTimeout bounds each iteration; without it, a hanging Screenshotter can wedge the agent loop indefinitely under the parent context's much-longer deadline."
