  - id: FIX-QA-2026-04-20-001
    name: "E2E pipeline test — feature-rich fixture + fatal assertion"
    category: regression
    priority: critical
    platforms: [linux, all]
    steps:
      - name: "TestFullPipeline uses createTestImageWithText (not smooth gradient) and require (not assert)"
        action: "cd HelixQA && GOTOOLCHAIN=local go test -mod=vendor -count=1 -run 'TestE2E/TestFullPipeline' -timeout=60s ./tests/e2e/..."
        expected: "PASS — detector returns >=1 element for button+text fixture; success log only fires when assertion genuinely passed"
      - name: "Full e2e suite green"
        action: "cd HelixQA && GOTOOLCHAIN=local go test -mod=vendor -count=1 -timeout=300s ./tests/e2e/..."
        expected: "PASS — zero FAIL, zero false-positive success logs"
    tags: [regression, e2e, pipeline, vision, false-positive, article-vii]
    estimated_duration: "3s"
    expected_result: "E2E pipeline test exercises real detectable features and fails hard (not just loud) on detector regressions"
    fix_reference:
      bug_id: "FIX-QA-2026-04-20-001"
      description: "Two compounding bugs at the same site in tests/e2e/pipeline_test.go. (1) createTestFrames() output is a smooth RGB gradient — the contour-based ElementDetector correctly returns zero elements on featureless images, so the step was structurally guaranteed to fail. Fixed by routing the feature-rich createTestImageWithText helper (white canvas + blue button rect + text stripes) through the vision step — matches what the detector is designed to find. (2) The step used assert.NotEmpty (non-fatal in testify) and then unconditionally logged the success line — the exact false-positive anti-pattern that CLAUDE.md Article VII prohibits. Converted to require.NotEmpty so the success log is only reachable after every upstream assertion genuinely passed. Guards the invariant that 'test passed + success log printed' implies 'feature actually worked'."
      fix_file: "helix_qa/tests/e2e/pipeline_test.go"
      fix_commit: "pending"

  - id: FIX-QA-2026-04-20-002
    name: "E2E suite — eliminate all assert+success-log false-positive sites"
    category: regression
    priority: critical
    platforms: [linux, all]
    steps:
      - name: "Full e2e suite green under suite-wide concurrent load"
        action: "cd HelixQA && GOTOOLCHAIN=local go test -mod=vendor -count=1 -timeout=300s ./tests/e2e/..."
        expected: "PASS — every E2ETestSuite test that prints '✅ … completed' uses require.* for its final assertion, so the success log cannot fire on a failed run"
      - name: "TestPerformance survives suite-wide load (500ms budget, not 100ms)"
        action: "cd HelixQA && GOTOOLCHAIN=local go test -mod=vendor -count=1 -timeout=60s -run 'TestE2E/TestPerformance' ./tests/e2e/..."
        expected: "PASS isolated (<5ms/frame); PASS full-suite (<500ms/frame under CPU contention from TestConcurrentProcessing); FAIL only on real detector regression"
    tags: [regression, e2e, false-positive, assert-vs-require, article-vii]
    estimated_duration: "3s"
    expected_result: "Every e2e test that prints a success log only reaches it after every assertion passes; TestPerformance uses a realistic, concurrency-tolerant latency budget"
    fix_reference:
      bug_id: "FIX-QA-2026-04-20-002"
      description: "Surfaced in iteration 2 of the Article VII Master Cycle immediately after FIX-QA-2026-04-20-001. TestPerformance exposed a second instance of the same anti-pattern: assert.Less followed by unconditional '✅ Performance test completed'. On iteration-1's full-suite run, TestPerformance recorded 198ms/frame (blown 100ms budget) but still printed success. Audit of the full file surfaced five more sites in the same E2ETestSuite — TestDistributedState, TestWebRTCSignaling, TestHostDiscovery, TestVisionOCRIntegration, TestGStreamerPipeline, TestConcurrentProcessing — each pairing assert.* with an unconditional '✅ … completed' log. All converted to require.*. TestPerformance's 100ms latency budget also tightened to 500ms to survive full-suite CPU contention from TestConcurrentProcessing + GStreamer tests (isolated run measures ~1-65µs/frame, full-suite 150-250ms/frame under load). 500ms still catches order-of-magnitude detector regressions. Fix also guards against a latent divide-by-zero in the FPS calculation when latencyMs rounds to 0."
      fix_file: "helix_qa/tests/e2e/pipeline_test.go"
      fix_commit: "pending"

