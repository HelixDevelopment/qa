      description: "Guards four structured-generation invariants. (1) MaxTextLen MUST count runes, not bytes — HelixQA runs multilingual (Cyrillic, CJK, etc.) and byte-counting would falsely reject perfectly valid 3-character Cyrillic input under MaxTextLen=3. (2) ScreenBounds checks MUST only fire on Kinds with coordinates (Click, Swipe); Type/Key/Done/Wait have no coords and must not be rejected for being 'outside bounds'. (3) The retry instruction MUST preserve the original goal text AND append the specific validation error — just re-sending the original wastes a VLM call because the model has no signal that the previous attempt failed. (4) ErrRetriesExhausted MUST be a unique sentinel so callers can errors.Is-branch on 'retries exhausted' vs 'VLM unreachable' vs 'context canceled' — all three are different failure modes with different recovery strategies."
      fix_file: "helix_qa/pkg/agent/sglang/sglang.go"
      fix_commit: "pending"

  - id: FIX-OC4-014
    name: "pkg/nexus/observe/axtree/ios — idb JSON tolerance + cross-platform Node contract"
    category: regression
    priority: high
    platforms: [ios, all]
    steps:
      - name: "idb emits either {object} or [array] — parser handles both, falls back to scalar-JSON error"
