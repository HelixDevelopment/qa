      description: "U-cycle partial closure of DEFER-QA-2026-04-21-001 items #3 and #5. Previously, RunAll / RunByCategory passed context.Background() to their services — long-running safely, but losing every request-scoped value (tracing, request_id, auth subject). Switched to context.WithoutCancel(c.Request.Context()) which is the Go 1.21+ primitive built exactly for this shape: inherit values, ignore cancel. Only item #4 of DEFER-001 remains open — threading ctx end-to-end through challenges/pkg/runner so individual challenges co-operatively observe progress, which is a submodule refactor across 508 challenges."
